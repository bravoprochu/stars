<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Gwieździste niebo · Spadające gwiazdy</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05060f;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      #scene {
        display: block;
        position: fixed;
        inset: 0;
        touch-action: none;
      }
      #hud {
        position: fixed;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        padding: 8px 18px;
        border-radius: 999px;
        font-size: 14px;
        letter-spacing: 0.03em;
        color: #dfe7ff;
        background: rgba(12, 18, 45, 0.45);
        border: 1px solid rgba(150, 180, 255, 0.18);
        backdrop-filter: blur(6px);
        user-select: none;
        pointer-events: none;
        z-index: 10;
      }
      #tip {
        position: fixed;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 12px;
        color: rgba(200, 214, 255, 0.6);
        user-select: none;
        pointer-events: none;
        z-index: 10;
        animation: fade 6s ease-in-out forwards;
      }
      @keyframes fade {
        0%,
        70% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="hud">Trafienia: 0 · Celność: 100%</div>
    <div id="tip">Kliknij spadającą gwiazdę, gdy przeleci przez niebo ✦</div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
